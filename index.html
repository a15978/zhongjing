<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>中京 · 拍摄方案</title>
<style>
  :root{--ink:#1a1a1a;--sub:#8a8378;--line:#e6e1d8;--bg:#faf8f4;--accent:#9a6a3a}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);min-height:100vh;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei","Source Han Sans SC",sans-serif}
  .wrap{max-width:760px;margin:0 auto;padding:38px 20px 60px}
  .mark{font-size:11px;letter-spacing:.34em;color:var(--sub);text-transform:uppercase}
  h1{font-size:25px;font-weight:600;letter-spacing:.08em;margin:12px 0 4px}
  .sub{font-size:12px;color:var(--sub);letter-spacing:.06em;margin:0 0 8px}
  .hd{border-bottom:1px solid var(--line);padding-bottom:18px}
  #list{margin-top:4px}
  .card{display:block;padding:22px 4px;border-bottom:1px solid var(--line);
    text-decoration:none;color:inherit}
  .card:active{background:#f3efe7}
  .card .n{font-size:11px;letter-spacing:.22em;color:var(--accent)}
  .card .h{font-size:18px;font-weight:600;margin:7px 0 6px;line-height:1.45}
  .card .m{font-size:12px;color:var(--sub);letter-spacing:.06em}
  .card.draft{background:#fdf6e9}
  .card.draft:active{background:#f8ecd4}
  .card.draft .n{color:#b8751a}
  .card.draft .m{color:#a06a22}
  .foot{margin-top:40px;text-align:center;font-size:11px;color:#b5aea2;letter-spacing:.1em;line-height:2}
</style>
</head>
<body>
<div class="wrap">
  <div class="hd">
    <div class="mark">Zhongjing Electric</div>
    <h1>中京 · 拍摄方案</h1>
    <p class="sub">共 2 个方案 · 另有 1 组候选待挑 · 更新于 2026-11-08</p>
  </div>
  <div id="list">
    <a class="card" href="./001.html">
      <div class="n">001</div>
      <div class="h">老板为什么还在现场</div>
      <div class="m">拍摄卡 · 手机可看 · 可打印</div>
    </a>
    <a class="card" href="./002.html">
      <div class="n">002</div>
      <div class="h">从卖二手车到二十一个班组</div>
      <div class="m">拍摄卡 · 手机可看 · 可打印</div>
    </a>
    <a class="card draft" href="./003.html">
      <div class="n">003</div>
      <div class="h">三条候选脚本 · 待挑</div>
      <div class="m">候选草稿 · 挑一条 · 未定稿</div>
    </a>
  </div>
  <div class="foot">内部资料 · 请勿外传</div>
</div>
</body>
</html>
